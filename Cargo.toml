[package]
name = "redakt"
version = "0.0.7"
edition = "2021"
description = "Offline PII redaction with trained and rule-based detectors"
include = ["/src/**", "/tests/**", "/examples/openai_filter.py", "/models/weights.bin", "/models/pii.bin", "/models/pii-cues.bin", "/assets/logo.svg", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE"]
license = "Apache-2.0"
repository = "https://github.com/thoriqakbar0/redakt"

[dependencies]
ring = "0.17"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
