[package]
name = "redakt"
version = "0.0.5"
edition = "2021"
description = "Native compiled ternary-gated PII rules detector"
include = ["/src/**", "/tests/**", "/models/weights.bin", "/assets/logo.svg", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE"]
license = "Apache-2.0"
repository = "https://github.com/thoriqakbar0/redakt"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
