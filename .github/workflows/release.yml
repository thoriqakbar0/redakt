name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.0.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check tag and package
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          rustup toolchain install stable --profile minimal
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$TAG" = "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cargo +stable package --locked

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build and test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET" --toolchain stable
          cargo +stable test --locked --target "$TARGET"
          cargo +stable build --release --locked --target "$TARGET"
      - name: Package and smoke test
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile
          import zipfile

          target = os.environ['TARGET']
          tag = os.environ['TAG']
          name = f'redakt-{tag}-{target}'
          binary = 'redakt.exe' if 'windows' in target else 'redakt'
          folder = Path(name)
          folder.mkdir()
          shutil.copy2(Path('target') / target / 'release' / binary, folder / binary)

          for document in ('README.md', 'LICENSE', 'NOTICE'):
              shutil.copy2(document, folder / document)

          Path('dist').mkdir()
          if 'windows' in target:
              archive = Path('dist') / f'{name}.zip'
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for member in folder.iterdir():
                      bundle.write(member, member.as_posix())

              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall('unpacked')
          else:
              archive = Path('dist') / f'{name}.tar.gz'
              with tarfile.open(archive, 'w:gz') as bundle:
                  bundle.add(folder, arcname=name)

              with tarfile.open(archive) as bundle:
                  bundle.extractall('unpacked', filter='data')

          executable = Path('unpacked') / name / binary
          version = subprocess.check_output(
              [str(executable), '--version'], encoding='utf-8',
          ).strip()
          assert version == f'redakt {tag.removeprefix("v")}', version

          result = subprocess.run(
              [str(executable), '--irreversible'], input='SSN 123-45-6789', encoding='utf-8',
              capture_output=True, check=True,
          )
          assert result.stdout == 'SSN [SSN_1]', result.stdout
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Create checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes 'Draft. Replace these notes with the version changelog before publishing.' \
            ./*.tar.gz ./*.zip SHA256SUMS
